<script>

    /*********************************************************************************/
    /******************************* Global Variables ********************************/

    // Detect experiment condition from URL parameter
    // Execute php -S localhost:8000
    // For treatment group: http://localhost:8000/sin_experiment.html?condition=treatment
    // For control group: http://localhost:8000/sin_experiment.html?condition=control
    const urlParams = new URLSearchParams(window.location.search);
    const experimentCondition = urlParams.get('condition') || 'treatment'; // default to treatment
    const isControlGroup = experimentCondition === 'control';

    var participant_id = ''; // Participant ID
    var maxSNR = 12; // dB
    var minSNR = -6; // dB
    var currentSNR = maxSNR; // Start at max SNR
    var stepSize = 2; // dB
    var trainingTrialLimit = 60; // Fixed number of training sentences
    var trainingTrialsCompleted = 0; // Count completed training sentences
    var trainingConsecutiveCorrect = 0; // Count consecutive correct during training
    var currentSentenceData = null; // Store current sentence object globally
    var currentTrainingResponse = null; // Store training response for feedback
    var firstAttemptScore = null; // Store first attempt score for SNR adjustment
    var didReplayThisTrial = false; // Track replay usage for current training sentence
    var practiceSentences = []; // Pool of practice sentences
    var pretestSentences = []; // Pool of pretest sentences
    var trainingSentences = []; // Pool of training sentences
    var posttestSentences = []; // Pool of posttest sentences

    // Reversal-tracking for pretest/posttest SNR-50 calculation
    var reversalPrevDirection = 0; // -1 down, +1 up, 0 none
    var reversalPrevSNR = null; // Previous SNR at reversal
    var reversalsArray = []; // Array of reversal SNRs
    var targetReversals = 6; // Average over last 6 reversals
    var stopReversalCount = 8; // Stop after 8 reversals
    var trialCap = 25; // Maximum trials per test

    // Completion text
    var finishText = `<h2>Thank You!</h2>
                    <p>You have completed the speech-in-noise listening comprehension study.</p>
                    <p>Your participation is greatly appreciated and will contribute to our understanding of how auditory processing training affects speech comprehension in noise for L2 English learners.</p>
                    <p>Feel free to ask any questions you may have about the study or your participation.</p>
                    <p>Thank you for your time and effort!</p>`

    // Manual progress bar updates
    const PROGRESS_MARKERS = {
        after_id: 0.02,
        after_preload: 0.04,
        after_soundcheck: 0.06,
        after_practice_instructions: 0.08,
        practice_end: 0.13,
        after_pretest_instructions: 0.15,
        pretest_end: 0.30,
        after_training_instructions: 0.32,
        training_end: 0.83,
        after_posttest_instructions: 0.85
    };
    let practiceCompleted = 0; // Track practice progress
    let pretestCompleted = 0; // Track pretest progress
    let posttestCompleted = 0; // Track posttest progress

    // Map of contractions to their expanded forms (for scoring)
    const contractionMap = {
        "they're": "they are",
        "she's": "she is",
        "he's": "he is",
        "it's": "it is",
    };

    /*********************************************************************************/
    /**************************** User-Defined Functions *****************************/
    /*********************************************************************************/

    // Audio setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Function to load audio buffer
    function loadAudioBuffer(url) {
        return fetch(url)
            .then(response => response.arrayBuffer())
            .then(arrayBuffer => audioCtx.decodeAudioData(arrayBuffer));
    }

    // shuffleArray function
    function shuffleArray(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Function to prepare sentence pool
    async function prepareSentences(configPath, shuffle) {
        // Load sentence list JSON
        const response = await fetch(configPath);
        const config = await response.json();

        // Flatten sentences
        const allSentences = Object.entries(config.rawLists).flatMap(([listId, sentences]) =>
            sentences.map(sentence => ({
                id: sentence.id,
                text: sentence.text,
                listId: listId,
                path: `sound/speech/${sentence.id}.wav`
            }))
        );

        // Return shuffled or unshuffled sentences
        return shuffle ? shuffleArray(allSentences) : allSentences;
    }

    // Function to get next sentence from a specific pool
    function getNextSentence(pool) {
        if (pool.length === 0) {
            return null;
        }
        return pool.pop();
    }

    /** Scoring functions for HINT responses **/

    // Normalize text by lowercasing, removing punctuation, and trimming whitespace
    function normalise(text) {
        return text
            .toLowerCase()
            .replace(/[^\w\s]/g, "") // Remove punctuation
            .replace(/\s+/g, " ") // Collapse multiple spaces
            .trim();
    }

    // Get all word forms (word + any contractions/expansions it matches)
    function getWordForms(word) {
        const lowercaseWord = word.toLowerCase();
        const normalized = normalise(word);
        const forms = [normalized];

        // Check if this is a contraction; if so, add both the expanded form with and without spaces
        if (contractionMap[lowercaseWord]) {
            const expanded = normalise(contractionMap[lowercaseWord]);
            forms.push(expanded); // "they are"
        }

        // Check reverse: if this is an expansion, find and add the contraction
        for (const [contraction, expansion] of Object.entries(contractionMap)) {
            if (normalise(expansion) === normalized) {
                forms.push(normalise(contraction));
            }
        }

        return [...new Set(forms)]; // Remove duplicates
    }

    // Expand "(A/The) boy (is/was) here" → [["a","the"],["boy"],["is","was"],["here"]]
    // Also expands contractions, e.g., "they're" → ["theyre", "they are"]
    function expandSentence(rawSentence) {
        // Split sentence into tokens
        const tokens = rawSentence.split(" ");
        const expanded = [];

        // Process each token
        tokens.forEach(token => {
            // Handle parenthetical options like (a/the) or (is/was) or (they're/they are)
            if (token.startsWith("(") && token.endsWith(")")) {
                const opts = token
                    .slice(1, -1)
                    .split("/")
                    .flatMap(w => getWordForms(w)); // Apply getWordForms to handle contractions
                expanded.push(opts);
            } else {
                // Remove trailing punctuation before processing
                const cleanToken = token.replace(/[.,!?;:]+$/, "");
                if (cleanToken) {
                    // Include all forms (word + contractions/expansions)
                    expanded.push(getWordForms(cleanToken));
                }
            }
        });

        return expanded;
    }

    // Score user response against expected sentence
    function scoreHintResponse(rawSentence, userResponse) {
        // Expand expected sentence and normalise user response
        const expected = expandSentence(rawSentence);
        const responseWords = normalise(userResponse).split(" ");
        const usedIndices = new Set(); // Track which response words have been used

        // Initialise scoring variables
        let correct = 0;
        let total = expected.length;

        // Check each expected position for matches
        const details = expected.map((options, i) => {
            let match = false;
            // Check if any unused response word(s) match this expected position
            for (let j = 0; j < responseWords.length; j++) {
                if (usedIndices.has(j)) continue;

                // Try each option at this position
                for (let option of options) {
                    // Single-word option: direct match
                    if (!option.includes(" ") && option === responseWords[j]) {
                        match = true;
                        correct++;
                        usedIndices.add(j);
                        break;
                    }
                    // Multi-word option: try to match consecutive response words
                    if (option.includes(" ")) {
                        const optionWords = option.split(" ");
                        let allMatch = true;
                        // Check if the next N response words match this option
                        for (let k = 0; k < optionWords.length; k++) {
                            if (j + k >= responseWords.length || responseWords[j + k] !== optionWords[k]) {
                                allMatch = false;
                                break;
                            }
                        }
                        if (allMatch) {
                            match = true;
                            correct++;
                            // Mark all words in this option as used
                            for (let k = 0; k < optionWords.length; k++) {
                                usedIndices.add(j + k);
                            }
                            break;
                        }
                    }
                }
                if (match) break;
            }
            return {
                options,
                matched: match
            };
        });

        return {
            correct,
            total,
            proportion: correct / total,
            details
        };
    }

    // Generate HTML feedback comparing user response to expected sentence
    function generateFeedbackHTML(expectedSentence, userResponse, score) {
        // Build feedback HTML using pre-computed score details
        let feedbackHTML = '<div style="text-align: center; font-size: 18px;">';
        feedbackHTML += '<h3>Feedback</h3>';
        feedbackHTML += `<p><strong>Your score: ${score.correct}/${score.total} words correct (${Math.round(score.proportion * 100)}%)</strong></p>`;

        // Show expected sentence with word-by-word highlighting
        feedbackHTML += '<p style="margin: 20px 0;"><strong>Expected sentence:</strong></p>';
        feedbackHTML += '<p style="font-size: 16px; line-height: 2; font-family: monospace;">';

        // Use the score details to highlight each word
        const sentenceWords = expectedSentence.split(" ");
        score.details.forEach((detail, i) => {
            const displayWord = sentenceWords[i] || '';
            const statusColor = detail.matched ? 'green' : 'red';
            feedbackHTML += `<span style="color: ${statusColor}; margin: 0 8px;">${displayWord}</span>`;
        });

        // Close expected sentence paragraph
        feedbackHTML += '</p>';
        feedbackHTML += `<p style="margin: 20px 0;"><strong>You wrote:</strong></p><p style="font-size: 16px; font-family: monospace; padding: 10px; background-color: #f0f0f0; border-radius: 4px;">"${userResponse}"</p>`;
        feedbackHTML += '</div>';

        return feedbackHTML;
    }

    // Function to play audio with babble at specified SNR
    function playAudioWithBabble(speechPath, snrLevel) {
        const babblePath = `sound/babble/SNR${snrLevel}dB.wav`;

        // Load and play audio buffers
        Promise.all([
            loadAudioBuffer(speechPath),
            loadAudioBuffer(babblePath)
        ]).then(function (buffers) {
            const speechSource = audioCtx.createBufferSource();
            const babbleSource = audioCtx.createBufferSource();

            speechSource.buffer = buffers[0];
            babbleSource.buffer = buffers[1];

            speechSource.connect(audioCtx.destination);
            babbleSource.connect(audioCtx.destination);

            // Calculate random offset for babble to start at different positions
            const babbleDuration = babbleSource.buffer.duration;
            const requiredDuration = 1.0 + speechSource.buffer.duration + 1.0;
            const maxOffset = Math.max(0, babbleDuration - requiredDuration);
            const randomOffset = Math.random() * maxOffset;

            // Synchronise start/stop times
            const startTime = audioCtx.currentTime + 0.5;
            babbleSource.start(startTime, randomOffset, requiredDuration);
            speechSource.start(startTime + 1.0);
        });
    }

    // Function to play replay audio (accepts SNR parameter for training phase)
    function playReplayAudio(snr = currentSNR) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        playAudioWithBabble(currentSentenceData.path, snr);
    }

    // Function to finish experiment and display thank you message
    function finish() {
        const DOM_target = document.querySelector('#jspsych-content');
        DOM_target.innerHTML = finishText;
        jsPsych.pluginAPI.cancelAllKeyboardResponses();
        jsPsych.pluginAPI.clearAllTimeouts();
    }

    // Function to save data via AJAX to PHP endpoint (async save during experiment)
    function saveDataToServer(csvData) {
        fetch('save_data.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                participant_id: participant_id,
                csv_data: csvData
            })
        })
            .then(response => response.json())
            .then(result => {
                console.log('Data saved:', result);
            })
            .catch(error => {
                console.error('Error saving data:', error);
            });
    }

    // Function to save data reliably on page unload/reload using sendBeacon
    function saveDataOnUnload(csvData) {
        // Use FormData for sendBeacon as it handles encoding properly
        const formData = new FormData();
        formData.append('participant_id', participant_id);
        formData.append('csv_data', csvData);
        navigator.sendBeacon('save_data.php', formData);
    }

    // Function to set progress bar value (0 to 1)
    function setProgress(value) {
        const clamped = Math.max(0, Math.min(1, value));
        if (jsPsych.progressBar) jsPsych.progressBar.progress = clamped;
    }

    // Helper function to compute mean of last N elements in an array
    function mean(arr) {
        if (!arr || arr.length === 0) return null;
        const s = arr.slice().sort((a, b) => a - b);
        const last = s.slice(-targetReversals);
        const sum = last.reduce((a, b) => a + b, 0);
        return sum / last.length;
    }

    /*********************************************************************************/
    /***************************** Initialising jsPsych ******************************/
    /*********************************************************************************/

    // Initialise jsPsych
    var jsPsych = initJsPsych({
        show_progress_bar: true,
        auto_update_progress_bar: false,
        on_finish: function () {
            // Get only pretest, posttest, and training phase data
            const experimentalData = jsPsych.data.get().filterCustom(d =>
                ['pretest', 'posttest', 'training'].includes(d.phase)
            );
            const csvData = experimentalData.csv();

            // Save to server via PHP
            saveDataToServer(csvData);

            // Display finish message
            finish();
        },
        on_close: function () {
            // Backup save on tab close or reload using sendBeacon
            const experimentalData = jsPsych.data.get().filterCustom(d =>
                ['pretest', 'posttest', 'training'].includes(d.phase)
            );
            const csvData = experimentalData.csv();

            saveDataOnUnload(csvData);
        }
    });


    // Preload audio files
    var preload = {
        type: jsPsychPreload,
        continue_after_error: true,
        on_finish: function () {
            setProgress(PROGRESS_MARKERS.after_preload);
        },
        audio: function () {
            // Combine all sentence pools and extract paths
            const sentencePaths = [
                ...practiceSentences,
                ...pretestSentences,
                ...trainingSentences,
                ...posttestSentences
            ].map(sentence => sentence.path);

            // Generate babble file paths
            const babblePaths = [];
            for (let snr = minSNR; snr <= maxSNR; snr += stepSize) {
                babblePaths.push(`sound/babble/SNR${snr}dB.wav`);
            }

            return [...sentencePaths, ...babblePaths];
        }
    };

    /*********************************************************************************/
    /***************************** Participant ID Block ******************************/
    /*********************************************************************************/

    var participant_id_block = {
        type: jsPsychSurveyText,
        questions: [{ prompt: "Please enter your participant ID:", name: "participant_id" }],
        on_load: function () {
            // Set progress to start
            setProgress(0);
        },
        on_finish: function (data) {
            jsPsych.data.addProperties({
                participant_id: data.response.participant_id,
                condition: experimentCondition
            });
            participant_id = data.response.participant_id;

            setProgress(PROGRESS_MARKERS.after_id);
        }
    };

    /*********************************************************************************/
    /******************************* Sound Check Block *******************************/
    /*********************************************************************************/

    // Define sound check block
    var sound_check = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `<h2>Sound Check</h2>
                   <p>Please ensure your headphones are on and the volume is set to a comfortable level.</p>
                   <p>Click the button below to play a test sound.</p>`,
        choices: ['Play Sound', 'Continue'],
        on_finish: async function (data) {
            // Only play if they clicked "Play Sound" (response = 0)
            if (data.response === 0) {
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                // Load and play test sound
                const buffer = await loadAudioBuffer('sound/speech/L00_S02.wav');
                const testSource = audioCtx.createBufferSource();
                testSource.buffer = buffer;
                testSource.connect(audioCtx.destination);
                testSource.start(audioCtx.currentTime + 0.1);
            }
        }
    };

    // Define sound check procedure with loop
    var sound_check_procedure = {
        timeline: [sound_check],
        loop_function: function (data) {
            // Get the last trial
            var lastTrial = data.last(1).values()[0];
            // If they clicked "Play Sound" (response = 0), loop again
            const shouldLoop = lastTrial.response === 0;
            if (!shouldLoop) {
                setProgress(PROGRESS_MARKERS.after_soundcheck);
            }
            return shouldLoop;
        }
    };

    /*********************************************************************************/
    /****************************** Instructions Block *******************************/
    /*********************************************************************************/

    // Define practice instructions block
    var practice_instructions_block = {
        type: jsPsychInstructions,
        pages: [
            `<h2>Practice Instructions</h2>
            <p>In this practice section, you will hear three sentences with background noise.</p>
            <p>Your task is to listen carefully and type out the words you hear in each sentence.</p>
            <p>After hearing each sentence, you will be prompted to enter your response.</p>
            <p>Remember to separate each word in your response with a space.</p>
            <p>Press 'Next' to begin the practice section.</p>`
        ],
        show_clickable_nav: true,
        allow_backward: false,
        on_finish: function () {
            setProgress(PROGRESS_MARKERS.after_practice_instructions);
        }
    };

    // Define pretest instructions block
    var pretest_instructions_block = {
        type: jsPsychInstructions,
        pages: [
            `<h2>Practice Complete</h2>
            <p>You have completed the practice section.</p>
            <p>Now, the pre-test will begin.</p>
            <p>Your task remains the same: listen to each sentence with background noise and type out the words you hear.</p>
            <p>You will hear up to 25 sentences in this section.</p>
            <p>The background noise level will adjust based on your performance.</p>
            <p>Remember to separate each word in your response with a space and check your spelling before submitting.</p>
            <p>Press 'Next' to start the pre-test.</p>`
        ],
        show_clickable_nav: true,
        allow_backward: false,
        on_finish: function () {
            setProgress(PROGRESS_MARKERS.after_pretest_instructions);
        }
    };

    // Define training instructions block (treatment) / break instructions (control)
    var training_instructions_block = {
        type: jsPsychInstructions,
        pages: isControlGroup ? [
            `<h2>Pre-test Complete</h2>
            <p>You have completed the pre-test section.</p>
            <p>Now, you will take 30-minute break.</p>
            <p>You may rest or engage in any quiet activity of your choice.</p>
            <p>We will notify you when the break is complete and the post-test is ready to begin.</p>
            <p>Press 'Next' to begin your break.</p>`
        ] : [
            `<h2>Pre-test Complete</h2>
            <p>You have completed the pre-test section.</p>
            <p>Now, you will begin the training phase.</p>
            <p>This section will last approximately 30 minutes.</p>
            <p>Continue to listen to each sentence with background noise and type out the words you hear.</p>
            <p>The background noise level will adjust based on your performance.</p>
            <p>After each response, you will receive feedback on your performance and have the option to replay the audio.</p>
            <p>Remember to separate each word in your response with a space and check your spelling before submitting.</p>
            <p>Press 'Next' to start the training phase.</p>`
        ],
        show_clickable_nav: true,
        allow_backward: false,
        on_finish: function () {
            setProgress(PROGRESS_MARKERS.after_training_instructions);
        }
    };

    // Define posttest instructions block
    var posttest_instructions_block = {
        type: jsPsychInstructions,
        pages: isControlGroup ? [
            `<h2>Break Complete</h2>
            <p>Your 30-minute break is now complete.</p>
            <p>Now, the final post-test will begin.</p>
            <p>Your task remains the same: listen to each sentence with background noise and type out the words you hear.</p>
            <p>You will hear up to 25 sentences in this final section.</p>
            <p>The background noise level will adjust based on your performance.</p>
            <p>Remember to separate each word in your response with a space and check your spelling before submitting.</p>
            <p>Press 'Next' to start the post-test.</p>`
        ] : [
            `<h2>Training Complete</h2>
            <p>You have completed the training phase.</p>
            <p>Now, the final post-test will begin.</p>
            <p>Your task remains the same: listen to each sentence with background noise and type out the words you hear.</p>
            <p>You will hear up to 25 sentences in this final section.</p>
            <p>The background noise level will adjust based on your performance.</p>
            <p>Remember to separate each word in your response with a space and check your spelling before submitting.</p>
            <p>Press 'Next' to start the post-test.</p>`
        ],
        show_clickable_nav: true,
        allow_backward: false,
        on_finish: function () {
            setProgress(PROGRESS_MARKERS.after_posttest_instructions);
        }
    };

    /*********************************************************************************/
    /******************************** Practice Block *********************************/
    /*********************************************************************************/

    // Define practice block
    var practice_block = [];

    // Simple start trial to begin practice
    var practice_start_trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Press space when ready.</p>',
        choices: [' '],
        // Ensure audio context is running
        on_finish: function () {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            practiceCompleted = 0;
            setProgress(PROGRESS_MARKERS.after_practice_instructions);
        }
    };

    // Define practice audio trial
    var practice_sound = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Listening...</p>',
        choices: "NO_KEYS",
        trial_duration: 5000,

        on_start: function (trial) {
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Get next practice sentence object
            const sentenceObj = practiceSentences.pop();

            playAudioWithBabble(sentenceObj.path, maxSNR);
        }
    };

    // Define practice response question
    var practice_question = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: "Enter the words you heard in the audio:", name: 'response' }
        ],
        on_finish: function (data) {
            // No scoring or SNR adjustment in practice
            const userResponse = data.response.response.trim().toLowerCase();
            data.user_response = userResponse;

            // Progress: practice is fixed at 3 sentences
            practiceCompleted += 1;
            const frac = Math.min(1, Math.max(0, practiceCompleted / 3));
            setProgress(
                PROGRESS_MARKERS.after_practice_instructions +
                frac * (PROGRESS_MARKERS.practice_end - PROGRESS_MARKERS.after_practice_instructions)
            );
        }
    };

    // Define practice procedure (3 trials)
    var practice_procedure = {
        timeline: [practice_sound, practice_question],
        repetitions: 3
    };

    practice_block.push(practice_start_trial);
    practice_block.push(practice_procedure);

    /*********************************************************************************/
    /********************************* Pretest Block *********************************/
    /*********************************************************************************/

    // Define pretest block
    var pretest_block = [];

    // Simple start trial to begin pretest
    var pretest_start_trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Press space when ready.</p>',
        choices: [' '],
        on_finish: function () {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            // Reset SNR for pretest
            currentSNR = maxSNR;

            pretestCompleted = 0;
            setProgress(PROGRESS_MARKERS.after_pretest_instructions);
        }
    };

    // Define pretest audio trial
    var pretest_sound = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Listening...</p>',
        choices: "NO_KEYS",
        trial_duration: 5000,

        on_start: function (trial) {
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Get next sentence object
            const sentenceObj = getNextSentence(pretestSentences);

            // Store globally for data recording
            currentSentenceData = sentenceObj;

            playAudioWithBabble(sentenceObj.path, currentSNR);
        },

        // Store data for each trial
        on_finish: function (data) {
            const sentenceData = currentSentenceData || {};
            data.phase = 'pretest';
            data.sentence_path = sentenceData.path || '';
            data.sentence_id = sentenceData.id || '';
            data.sentence_text = sentenceData.text || '';
            data.list_id = sentenceData.listId || '';
            data.SNR = currentSNR;
        }
    };

    // Define pretest response question
    var pretest_question = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: "Enter the words you heard in the audio:", name: 'response' }
        ],
        on_finish: function (data) {
            // Score response correctness
            const userResponse = data.response.response.trim().toLowerCase();
            const expectedSentence = currentSentenceData.text;
            const score = scoreHintResponse(expectedSentence, userResponse);

            // Store data
            data.phase = 'pretest';
            data.user_response = userResponse;
            data.expected_sentence = expectedSentence;
            data.words_correct = score.correct;
            data.words_total = score.total;
            data.proportion_correct = score.proportion;
            data.score_details = score.details;

            // Adjust SNR based on correctness, and track reversals
            const prevSNR = currentSNR;
            if (score.proportion === 1.0) {
                currentSNR = Math.max(currentSNR - stepSize, minSNR);
            } else {
                currentSNR = Math.min(currentSNR + stepSize, maxSNR);
            }

            // Determine new step direction: -1 down, +1 up, 0 no change
            const newDirection = currentSNR < prevSNR ? -1 : (currentSNR > prevSNR ? 1 : 0);
            let isReversal = false;
            if (reversalPrevDirection !== 0 && newDirection !== 0 && newDirection !== reversalPrevDirection) {
                // record reversal at the SNR before the step
                reversalsArray.push(prevSNR);
                isReversal = true;
            }
            reversalPrevDirection = newDirection;
            reversalPrevSNR = prevSNR;
            data.is_reversal = isReversal;

            // Progress: pretest is fixed at trialCap sentences
            pretestCompleted += 1;
            const frac = Math.min(1, Math.max(0, pretestCompleted / trialCap));
            setProgress(
                PROGRESS_MARKERS.after_pretest_instructions +
                frac * (PROGRESS_MARKERS.pretest_end - PROGRESS_MARKERS.after_pretest_instructions)
            );
        }
    };

    // Define pretest procedure (loop until stopping rule)
    var pretest_procedure = {
        timeline: [pretest_sound, pretest_question],
        loop_function: function () {
            // Continue looping while both conditions hold: trials < trialCap && reversals < stopReversalCount
            return (pretestCompleted < trialCap) && (reversalsArray.length < stopReversalCount);
        },
        on_timeline_finish: function () {
            // Use mean of last targetReversals reversals as SNR-50
            const revs = reversalsArray.slice(-targetReversals);
            const snr50 = mean(revs);

            jsPsych.data.addDataToLastTrial({ pretest_SNR_50: snr50, pretest_reversals: reversalsArray });

            // Set adaptive training starting SNR from SNR-50 (rounded to stepSize)
            if (snr50 !== null) {
                const rounded = Math.round(snr50 / stepSize) * stepSize;
                currentSNR = Math.max(Math.min(rounded, maxSNR), minSNR);
            }
        }
    };

    pretest_block.push(pretest_start_trial);
    pretest_block.push(pretest_procedure);

    /*********************************************************************************/
    /******************************** Training Block *********************************/
    /*********************************************************************************/

    // Define training block
    var training_block = [];

    // Simple start trial to begin training
    var training_start_trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Press space when ready.</p>',
        choices: [' '],
        on_finish: function () {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            setProgress(PROGRESS_MARKERS.after_training_instructions);
        }
    };

    // Define training audio trial
    var training_sound = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Listening...</p>',
        choices: "NO_KEYS",
        trial_duration: 5000,

        on_start: function (trial) {
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Get next sentence object
            const sentenceObj = getNextSentence(trainingSentences);
            currentSentenceData = sentenceObj;

            playAudioWithBabble(currentSentenceData.path, currentSNR);
        },

        // Store data for each trial
        on_finish: function (data) {
            const sentenceData = currentSentenceData || {};
            data.phase = 'training';
            data.sentence_path = sentenceData.path || '';
            data.sentence_id = sentenceData.id || '';
            data.sentence_text = sentenceData.text || '';
            data.list_id = sentenceData.listId || '';
            data.SNR = currentSNR;
        }
    };

    // Define training response question
    var training_question = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: "Enter the words you heard in the audio:", name: 'response' }
        ],
        on_finish: function (data) {
            // Score response correctness
            const userResponse = data.response.response.trim().toLowerCase();
            const expectedSentence = currentSentenceData.text;
            const score = scoreHintResponse(expectedSentence, userResponse);

            // Store for feedback trial
            currentTrainingResponse = userResponse;
            firstAttemptScore = score;

            // Store data
            data.phase = 'training';
            data.user_response = userResponse;
            data.expected_sentence = expectedSentence;
            data.words_correct = score.correct;
            data.words_total = score.total;
            data.proportion_correct = score.proportion;
            data.score_details = score.details;
            data.training_SNR_before = currentSNR;
        }
    };

    // Define feedback trial after each training question
    var training_feedback = {
        type: jsPsychHtmlButtonResponse,
        stimulus: function () {
            // Reset replay flag at start of feedback for this sentence
            didReplayThisTrial = false;
            // Generate feedback HTML
            let feedbackHTML = generateFeedbackHTML(
                currentSentenceData.text,
                currentTrainingResponse,
                firstAttemptScore
            );

            // Add replay button only if score was incorrect
            if (firstAttemptScore.proportion < 1.0) {
                feedbackHTML = feedbackHTML.replace('</div>',
                    `<p style="margin-top: 20px;"><button id="replayBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Replay Audio</button></p></div>`);
            }

            return feedbackHTML;
        },
        choices: ['Continue'],
        on_load: function () {
            // Add click handler for replay button if it exists
            const replayBtn = document.getElementById('replayBtn');
            if (replayBtn) {
                replayBtn.onclick = function (e) {
                    e.preventDefault();
                    // Mark replay used for this sentence
                    didReplayThisTrial = true;
                    // Replay using the SNR that was used for this trial (currentSNR)
                    playReplayAudio(currentSNR);
                };
            }

            // Allow Enter to continue
            const continueBtn = document.querySelector('.jspsych-btn');
            training_feedback._enterKeyListener = jsPsych.pluginAPI.getKeyboardResponse({
                callback_function: function () {
                    // Don't steal Enter from the replay button if it's focused
                    const activeEl = document.activeElement;
                    if (activeEl && activeEl.id === 'replayBtn') return;

                    if (continueBtn) continueBtn.click();
                },
                valid_responses: ['Enter'],
                rt_method: 'performance',
                persist: false,
                allow_held_key: false
            });
        },
        on_finish: function (data) {
            // Clean up Enter key listener
            if (training_feedback._enterKeyListener) {
                jsPsych.pluginAPI.cancelKeyboardResponse(training_feedback._enterKeyListener);
                training_feedback._enterKeyListener = null;
            }

            // Apply adaptive 2-down/1-up SNR adjustment
            if (firstAttemptScore.proportion === 1.0) {
                trainingConsecutiveCorrect += 1;
                // After 2 consecutive correct, decrease SNR
                if (trainingConsecutiveCorrect >= 2) {
                    currentSNR = Math.max(currentSNR - stepSize, minSNR);
                    trainingConsecutiveCorrect = 0;
                }
            } else {
                // On any incorrect response, increase SNR
                currentSNR = Math.min(currentSNR + stepSize, maxSNR);
                trainingConsecutiveCorrect = 0;
            }

            // Attach replay flag and the updated SNR to the corresponding training_question row
            const lastTwo = jsPsych.data.get().last(2).values(); // [question, feedback]
            const questionTrialIndex = lastTwo && lastTwo[0] ? lastTwo[0].trial_index : undefined;
            if (questionTrialIndex !== undefined) {
                jsPsych.data.get().filter({ trial_index: questionTrialIndex }).addToAll({ training_SNR_after: currentSNR, replay_used: didReplayThisTrial });
            }

            // Reset first attempt score for next sentence
            firstAttemptScore = null;

            // Progress: training is fixed at trainingTrialLimit sentences
            trainingTrialsCompleted += 1;
            const frac = Math.min(1, Math.max(0, trainingTrialsCompleted / trainingTrialLimit));
            setProgress(
                PROGRESS_MARKERS.after_training_instructions +
                frac * (PROGRESS_MARKERS.training_end - PROGRESS_MARKERS.after_training_instructions)
            );
        }
    };

    // Define training procedure 60 sentences, approx. 30 minutes)
    var training_procedure = {
        timeline: [training_sound, training_question, training_feedback],
        repetitions: trainingTrialLimit,
        on_timeline_finish: function () {
            // Ensure we land exactly at the end of training segment
            setProgress(PROGRESS_MARKERS.training_end);
        }
    };

    training_block.push(training_start_trial);
    training_block.push(training_procedure);

    /*********************************************************************************/
    /******************************** Posttest Block *********************************/
    /*********************************************************************************/

    // Define posttest block
    var posttest_block = [];

    // Simple start trial to begin posttest
    var posttest_start_trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Press space when ready.</p>',
        choices: [' '],
        on_finish: function () {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            // Reset SNR for posttest
            currentSNR = maxSNR;

            // Initialise reversal-tracking state for posttest
            reversalPrevDirection = 0;
            reversalPrevSNR = null;
            reversalsArray = [];

            posttestCompleted = 0;
            setProgress(PROGRESS_MARKERS.after_posttest_instructions);
        }
    };

    // Define posttest audio trial
    var posttest_sound = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Listening...</p>',
        choices: "NO_KEYS",
        trial_duration: 5000,

        on_start: function (trial) {
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Get next sentence object
            const sentenceObj = getNextSentence(posttestSentences);

            // Store globally for data recording
            currentSentenceData = sentenceObj;

            playAudioWithBabble(sentenceObj.path, currentSNR);
        },

        // Store data for each trial
        on_finish: function (data) {
            const sentenceData = currentSentenceData || {};
            data.phase = 'posttest';
            data.sentence_path = sentenceData.path || '';
            data.sentence_id = sentenceData.id || '';
            data.sentence_text = sentenceData.text || '';
            data.list_id = sentenceData.listId || '';
            data.SNR = currentSNR;
        }
    };

    // Define posttest response question
    var posttest_question = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: "Enter the words you heard in the audio:", name: 'response' }
        ],
        on_finish: function (data) {
            // Score response correctness
            const userResponse = data.response.response.trim().toLowerCase();
            const expectedSentence = currentSentenceData.text;
            const score = scoreHintResponse(expectedSentence, userResponse);

            // Store data
            data.phase = 'posttest';
            data.user_response = userResponse;
            data.expected_sentence = expectedSentence;
            data.words_correct = score.correct;
            data.words_total = score.total;
            data.proportion_correct = score.proportion;
            data.score_details = score.details;

            // Adjust SNR based on correctness, and track reversals
            const prevSNR = currentSNR;
            if (score.proportion === 1.0) {
                currentSNR = Math.max(currentSNR - stepSize, minSNR);
            } else {
                currentSNR = Math.min(currentSNR + stepSize, maxSNR);
            }

            // Determine new step direction: -1 down, +1 up, 0 no change
            const newDirection = currentSNR < prevSNR ? -1 : (currentSNR > prevSNR ? 1 : 0);
            let isReversal = false;
            if (reversalPrevDirection !== 0 && newDirection !== 0 && newDirection !== reversalPrevDirection) {
                reversalsArray.push(prevSNR);
                isReversal = true;
            }
            reversalPrevDirection = newDirection;
            reversalPrevSNR = prevSNR;
            data.is_reversal = isReversal;

            // Progress: posttest is fixed at trialCap sentences
            posttestCompleted += 1;
            const frac = Math.min(1, Math.max(0, posttestCompleted / trialCap));
            setProgress(
                PROGRESS_MARKERS.after_posttest_instructions +
                frac * (1 - PROGRESS_MARKERS.after_posttest_instructions)
            );
        }
    };

    // Define posttest procedure (trialCap trials)
    var posttest_procedure = {
        timeline: [posttest_sound, posttest_question],
        loop_function: function () {
            // Continue looping while both conditions hold: trials < trialCap && reversals < stopReversalCount
            return (posttestCompleted < trialCap) && (reversalsArray.length < stopReversalCount);
        },
        on_timeline_finish: function () {
            // Use mean of last targetReversals reversals as SNR-50
            const revs = reversalsArray.slice(-targetReversals);
            const snr50 = mean(revs);

            jsPsych.data.addDataToLastTrial({ posttest_SNR_50: snr50, posttest_reversals: reversalsArray });
        }
    };

    posttest_block.push(posttest_start_trial);
    posttest_block.push(posttest_procedure);

    /*********************************************************************************/
    /********************************** Break Block **********************************/
    /*********************************************************************************/

    // Define break block for control group (30 minutes)
    var break_block = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<h2>Break in Progress</h2>
                   <p>You are currently on your 30-minute break.</p>
                   <p>Please wait. When your break is complete, the next screen will appear automatically.</p>`,
        choices: "NO_KEYS",
        trial_duration: 30 * 60 * 1000, // 30 minutes in milliseconds
        on_load: function () {
            // Progress: update during the timed break
            const start = performance.now();
            break_block._progressInterval = window.setInterval(function () {
                const elapsed = performance.now() - start;
                const frac = Math.min(1, Math.max(0, elapsed / (30 * 60 * 1000)));
                const p = PROGRESS_MARKERS.after_training_instructions +
                    frac * (PROGRESS_MARKERS.training_end - PROGRESS_MARKERS.after_training_instructions);
                setProgress(p);
            }, 1000);
        },
        on_finish: function () {
            if (break_block._progressInterval) {
                window.clearInterval(break_block._progressInterval);
                break_block._progressInterval = null;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            setProgress(PROGRESS_MARKERS.training_end);
        }
    };

    /*********************************************************************************/
    /******************************** Build Timeline *********************************/
    /*********************************************************************************/

    // Timeline flow
    var timeline = [];
    timeline = timeline.concat(participant_id_block);
    timeline = timeline.concat(preload);
    timeline = timeline.concat(sound_check_procedure);
    timeline = timeline.concat(practice_instructions_block);
    timeline = timeline.concat(practice_block);
    timeline = timeline.concat(pretest_instructions_block);
    timeline = timeline.concat(pretest_block);
    timeline = timeline.concat(training_instructions_block);
    // Include training for treatment group OR break for control group
    if (!isControlGroup) {
        timeline = timeline.concat(training_block);
    } else {
        timeline = timeline.concat(break_block);
    }
    timeline = timeline.concat(posttest_instructions_block);
    timeline = timeline.concat(posttest_block);

    /*********************************************************************************/
    /********************************** Run jsPsych **********************************/
    /*********************************************************************************/

    // Run the experiment
    Promise.all([
        prepareSentences("configFiles/hint_practice_list.json", false),  // unshuffled practice sentences
        prepareSentences("configFiles/hint_pretest_list.json", true),  // shuffled pretest sentences
        prepareSentences("configFiles/hint_training_list.json", true),  // shuffled training sentences
        prepareSentences("configFiles/hint_posttest_list.json", true)   // shuffled posttest sentences
    ]).then(([practiceSents, pretestSents, trainingSents, posttestSents]) => {
        practiceSentences = practiceSents;
        pretestSentences = pretestSents;
        trainingSentences = trainingSents;
        posttestSentences = posttestSents;
        jsPsych.run(timeline);
    });

</script>
