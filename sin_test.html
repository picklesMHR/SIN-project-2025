<!DOCTYPE html>
<html>

<head>
    <title>SIN Test Experiment</title>
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugin-preload.js"></script>
    <script src="jspsych/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugin-survey-text.js"></script>
    <script src="jspsych/plugin-instructions.js"></script>
    <script src="jspsych/plugin-html-button-response.js"></script>
    <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />
</head>

<body></body>

<script>

    /*********************************************************************************/
    /******************************* Global Variables ********************************/
    /*********************************************************************************/

    participant_id = ''; // Participant ID
    maxSNR = 12; // dB
    minSNR = -4; // dB
    currentSNR = maxSNR;
    stepSize = 2; // dB
    var currentSentenceData = null; // Store current sentence object globally
    var sentencePool = []; // Pool of sentences to draw from
    var practiceSentences = []; // Pool of practice sentences

    /*********************************************************************************/
    /******************************* Global Functions ********************************/
    /*********************************************************************************/

    // Audio setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function loadAudioBuffer(url) {
        return fetch(url)
            .then(response => response.arrayBuffer())
            .then(arrayBuffer => audioCtx.decodeAudioData(arrayBuffer));
    }

    // shuffleArray function
    function shuffleArray(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Function to prepare sentence pool
    async function prepareSentences(configPath, shuffle) {
        // Load sentence list JSON
        const response = await fetch(configPath);
        const config = await response.json();

        // Flatten sentences
        const allSentences = Object.entries(config.rawLists).flatMap(([listId, sentences]) =>
            sentences.map(sentence => ({
                id: sentence.id,
                text: sentence.text,
                listId: listId,
                path: `sound/speech/${sentence.id}.wav`
            }))
        );

        // Return shuffled or unshuffled sentences
        return shuffle ? shuffleArray(allSentences) : allSentences;
    }

    // Function to get next sentence
    function getNextSentence() {
        if (sentencePool.length === 0) {
            return null;
        }
        return sentencePool.pop();
    }

    /** Scoring functions for HINT responses **/

    // Normalize text by lowercasing, removing punctuation, and trimming whitespace
    function normalise(text) {
        return text
            .toLowerCase()
            .replace(/[^\w\s]/g, "")
            .replace(/\s+/g, " ")
            .trim();
    }

    // Expand "(A/The) boy (is/was) here" → [["a","the"],["boy"],["is","was"],["here"]]
    function expandSentence(rawSentence) {
        const tokens = rawSentence.split(" ");
        const expanded = [];

        tokens.forEach(token => {
            if (token.startsWith("(") && token.endsWith(")")) {
                const opts = token
                    .slice(1, -1)
                    .split("/")
                    .map(w => normalise(w));
                expanded.push(opts);
            } else {
                expanded.push([normalise(token)]);
            }
        });

        return expanded;
    }

    // Score user response against expected sentence
    function scoreHintResponse(rawSentence, userResponse) {
        const expected = expandSentence(rawSentence);
        const responseWords = normalise(userResponse).split(" ");

        let correct = 0;
        let total = expected.length;

        const details = expected.map((options, i) => {
            const match = responseWords.some(w => options.includes(w));
            if (match) correct++;
            return {
                options,
                matched: match
            };
        });

        return {
            correct,
            total,
            proportion: correct / total,
            details
        };
    }

    /*********************************************************************************/
    /***************************** Initialising jsPsych ******************************/
    /*********************************************************************************/

    // Initialise jsPsych
    var jsPsych = initJsPsych({
        show_progress_bar: true,
        on_finish: function () {
            jsPsych.data.displayData();
        }
    });

    // Preload audio files
    var preload = {
        type: jsPsychPreload,
        continue_after_error: true,
        audio: function () {
            let audioFiles = [];
            // Load all practice and main sentence audio files
            practiceSentences.forEach(sentence => {
                audioFiles.push(sentence.path);
            });
            sentencePool.forEach(sentence => {
                audioFiles.push(sentence.path);
            });
            // Load all babble SNR levels
            for (let snr = minSNR; snr <= maxSNR; snr += stepSize) {
                audioFiles.push(`sound/babble/SNR${snr}dB.wav`);
            }
            return audioFiles;
        }
    };

    /*********************************************************************************/
    /***************************** Participant ID Block ******************************/
    /*********************************************************************************/

    var participant_id_block = {
        type: jsPsychSurveyText,
        questions: [{ prompt: "Please enter your participant ID:", name: "participant_id" }],
        on_finish: function (data) {
            jsPsych.data.addProperties({ participant_id: data.response.Q0 });
            participant_id = data.response.Q0;
        }
    };

    /*********************************************************************************/
    /******************************* Sound Check Block *******************************/
    /*********************************************************************************/

    var sound_check = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `<h2>Sound Check</h2>
                   <p>Please ensure your headphones are on and the volume is set to a comfortable level.</p>
                   <p>Click the button below to play a test sound.</p>`,
        choices: ['Play Sound', 'Continue'],
        on_finish: async function (data) {
            // Only play if they clicked "Play Sound" (response = 0)
            if (data.response === 0) {
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                const buffer = await loadAudioBuffer('sound/speech/L00_S01.wav');
                const testSource = audioCtx.createBufferSource();
                testSource.buffer = buffer;
                testSource.connect(audioCtx.destination);
                testSource.start(audioCtx.currentTime + 0.1);
            }
        }
    };

    var sound_check_procedure = {
        timeline: [sound_check],
        loop_function: function (data) {
            // Get the last trial
            var lastTrial = data.last(1).values()[0];
            // If they clicked "Play Sound" (response = 0), loop again
            return lastTrial.response === 0;
        }
    };

    /*********************************************************************************/
    /****************************** Instructions Block *******************************/
    /*********************************************************************************/

    var practice_instructions_block = {
        type: jsPsychInstructions,
        pages: [
            `<h2>Practice Instructions</h2>
            <p>In this practice section, you will hear several sentences with background noise.</p>
            <p>Your task is to type out the words you hear in each sentence as accurately as possible.</p>
            <p>After each sentence, you will be prompted to enter your response.</p>
            <p>Press 'Next' to begin the practice section.</p>`
        ],
        show_clickable_nav: true
    }

    var experiment_instructions_block = {
        type: jsPsychInstructions,
        pages: [
            `<h2>Practice Complete</h2>
            <p>You have completed the practice section.</p>
            <p>Now, the main experiment will begin.</p>
            <p>Your task remains the same: listen to each sentence with background noise and type out the words you hear.</p>
            <p>There will be a total of 15 sentences in this section.</p>
            <p>The background noise level will adjust based on your performance.</p>
            <p>Press 'Next' to start the main experiment.</p>`
        ],
        show_clickable_nav: true
    }

    /*********************************************************************************/
    /******************************** Practice Block *********************************/
    /*********************************************************************************/

    // Define practice block
    var practice_block = [];

    // Simple start trial to begin practice
    var practice_start_trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Press space to start the practice section.</p>',
        choices: [' '],
        // Ensure audio context is running
        on_finish: function () {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
    };

    // Define practice audio trial
    var practice_sound = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Listening...</p>',
        choices: "NO_KEYS",
        trial_duration: 5000,

        on_start: function (trial) {
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Get next practice sentence object and babble track
            const sentenceObj = practiceSentences.pop();
            const babblePath = `sound/babble/SNR${maxSNR}dB.wav`;

            // Load and play audio buffers
            Promise.all([
                loadAudioBuffer(sentenceObj.path),
                loadAudioBuffer(babblePath)
            ]).then(function (buffers) {
                const speechSource = audioCtx.createBufferSource();
                const babbleSource = audioCtx.createBufferSource();

                speechSource.buffer = buffers[0];
                babbleSource.buffer = buffers[1];

                speechSource.connect(audioCtx.destination);
                babbleSource.connect(audioCtx.destination);

                // Synchronise start/stop times: 500 ms silence -> 1000 ms babble -> target speech -> 1000 ms babble trailer
                const startTime = audioCtx.currentTime + 0.5;
                babbleSource.start(startTime);
                speechSource.start(startTime + 1.0);
                babbleSource.stop(startTime + 1.0 + speechSource.buffer.duration + 1.0);
            });
        }
    };

    // Define practice response question
    var practice_question = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: "Enter the words you heard in the audio:", name: 'response' }
        ],
        on_finish: function (data) {
            // No scoring or SNR adjustment in practice
            const userResponse = data.response.response.trim().toLowerCase();
            data.user_response = userResponse;
        }
    };

    // Define practice procedure
    var practice_procedure = {
        timeline: [practice_sound, practice_question],
        repetitions: 3
    };

    practice_block.push(practice_start_trial);
    practice_block.push(practice_procedure);

    /*********************************************************************************/
    /******************************* Experiment Block ********************************/
    /*********************************************************************************/

    // Define experiment block
    var exp_block = [];

    // Simple start trial to begin experiment
    var start_trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Press space to start the audio test.</p>',
        choices: [' '],
        // Ensure audio context is running
        on_finish: function () {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
    };

    // Define audio trial
    var exp_sound = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Listening...</p>',
        choices: "NO_KEYS",
        trial_duration: 5000,

        on_start: function (trial) {
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Get next sentence object and babble track
            const sentenceObj = getNextSentence();
            const babblePath = `sound/babble/SNR${currentSNR}dB.wav`;

            // Store globally for data recording
            currentSentenceData = sentenceObj;

            // Load and play audio buffers
            Promise.all([
                loadAudioBuffer(sentenceObj.path),
                loadAudioBuffer(babblePath)
            ]).then(function (buffers) {
                const speechSource = audioCtx.createBufferSource();
                const babbleSource = audioCtx.createBufferSource();

                speechSource.buffer = buffers[0];
                babbleSource.buffer = buffers[1];

                speechSource.connect(audioCtx.destination);
                babbleSource.connect(audioCtx.destination);

                // Synchronise start/stop times: 500 ms silence -> 1000 ms babble -> target speech -> 1000 ms babble trailer
                const startTime = audioCtx.currentTime + 0.5;
                babbleSource.start(startTime);
                speechSource.start(startTime + 1.0);
                babbleSource.stop(startTime + 1.0 + speechSource.buffer.duration + 1.0);
            });
        },

        // Store data for each trial
        on_finish: function (data) {
            const sentenceData = currentSentenceData || {};
            data.sentence_path = sentenceData.path || '';
            data.sentence_id = sentenceData.id || '';
            data.sentence_text = sentenceData.text || '';
            data.list_id = sentenceData.listId || '';
            data.SNR = currentSNR;
        }
    };

    // Define response question
    var exp_question = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: "Enter the words you heard in the audio:", name: 'response' }
        ],
        on_finish: function (data) {
            // Score response correctness
            const userResponse = data.response.response.trim().toLowerCase();
            const expectedSentence = currentSentenceData.text;

            const score = scoreHintResponse(expectedSentence, userResponse);

            data.user_response = userResponse;
            data.expected_sentence = expectedSentence;
            data.words_correct = score.correct;
            data.words_total = score.total;
            data.proportion_correct = score.proportion;
            data.score_details = score.details;

            // Adjust SNR based on correctness
            if (score.proportion === 1.0) {
                currentSNR = Math.max(currentSNR - stepSize, minSNR);
            } else {
                currentSNR = Math.min(currentSNR + stepSize, maxSNR);
            }
        }
    };

    // Define experiment procedure
    var exp_procedure = {
        timeline: [exp_sound, exp_question],
        repetitions: 15,
        on_timeline_finish: function () {
            // Calculate average SNR over last 10 trials
            const snrData = jsPsych.data.get().filterCustom(d => Number.isFinite(d.SNR));
            const snrValues = snrData.last(10).select('SNR').values;
            const avgSNR = snrValues.length
                ? snrValues.reduce((sum, val) => sum + val, 0) / snrValues.length
                : null;
            jsPsych.data.addDataToLastTrial({ SNR_50: avgSNR });
        }
    };

    exp_block.push(start_trial);
    exp_block.push(exp_procedure);

    /*********************************************************************************/
    /******************************** Build Timeline *********************************/
    /*********************************************************************************/

    // Timeline flow
    timeline = [];
    timeline = timeline.concat(participant_id_block);
    timeline = timeline.concat(preload);
    timeline = timeline.concat(sound_check_procedure);
    timeline = timeline.concat(practice_instructions_block);
    timeline = timeline.concat(practice_block);
    timeline = timeline.concat(experiment_instructions_block);
    timeline = timeline.concat(exp_block);

    /*********************************************************************************/
    /********************************** Run jsPsych **********************************/
    /*********************************************************************************/

    // Run the experiment
    Promise.all([
        prepareSentences("configFiles/hint_practice_list.json", false),  // unshuffled practice sentences first
        prepareSentences("configFiles/hint_sentence_lists.json", true)   // shuffled main sentences
    ]).then(([practiceSents, mainSentences]) => {
        practiceSentences = practiceSents;
        sentencePool = mainSentences;
        jsPsych.run(timeline);
    });

</script>

</html>
