<!DOCTYPE html>
<html>

<head>
    <title>SIN Test Experiment</title>
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugin-preload.js"></script>
    <script src="jspsych/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugin-survey-text.js"></script>
    <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />
</head>

<body></body>

<script>
    // Global variables
    maxSNR = 12;   // dB
    minSNR = -4;   // dB
    currentSNR = maxSNR;
    stepSize = 2; // dB
    var currentSpeechPath = null; // Store current sentence globally

    // Audio setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function loadAudioBuffer(url) {
        return fetch(url)
            .then(response => response.arrayBuffer())
            .then(arrayBuffer => audioCtx.decodeAudioData(arrayBuffer));
    }

    // Initialise jsPsych
    var jsPsych = initJsPsych({
        on_finish: function () {
            jsPsych.data.displayData();
        }
    });

    // Preload audio files
    var preload = {
        type: jsPsychPreload,
        continue_after_error: true,
        audio: (function () {
            let audioFiles = [];
            // Load all sentences
            for (let i = 1; i <= 10; i++) {
                audioFiles.push(`sound/speech/list_1/sentence_${i}.wav`);
            }
            // Load all babble SNR levels
            for (let snr = minSNR; snr <= maxSNR; snr += stepSize) {
                audioFiles.push(`sound/babble/SNR${snr >= 0 ? `+${snr}` : `${snr}`}dB.wav`);
            }
            return audioFiles;
        })()
    };

    // Define speech stimuli
    var speechStimuli = [];
    for (let i = 1; i <= 10; i++) {
        speechStimuli.push(`sound/speech/list_1/sentence_${i}.wav`);
    }

    // Shuffle function
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    shuffle(speechStimuli); // Shuffle sentences

    let sentenceQueue = [...speechStimuli]; // Queue of sentences

    // Function to get next sentence
    function getNextSentence() {
        if (sentenceQueue.length === 0) {
            return null;
        }
        return sentenceQueue.shift();
    }

    // Define experiment block
    var exp_block = [];

    // Simple start trial to begin experiment
    var start_trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Press space to start the audio test.</p>',
        choices: [' '],
        // Ensure audio context is running
        on_finish: function () {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
    };

    // Define audio trial
    var exp_sound = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Listening...</p>',
        choices: "NO_KEYS",
        trial_duration: 5000,

        on_start: function (trial) {
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Get audio file paths
            const speechPath = getNextSentence();
            const snrStr = currentSNR >= 0 ? `+${currentSNR}` : `${currentSNR}`;
            const babblePath = `sound/babble/SNR${snrStr}dB.wav`;

            if (!speechPath) {
                console.log("No more sentences available.");
                jsPsych.endCurrentTimeline();
                return;
            }

            // Store globally for data recording
            currentSpeechPath = speechPath;

            // Load and play audio buffers
            Promise.all([
                loadAudioBuffer(speechPath),
                loadAudioBuffer(babblePath)
            ]).then(function (buffers) {
                const speechSource = audioCtx.createBufferSource();
                const babbleSource = audioCtx.createBufferSource();

                speechSource.buffer = buffers[0];
                babbleSource.buffer = buffers[1];

                speechSource.connect(audioCtx.destination);
                babbleSource.connect(audioCtx.destination);

                // Synchronise start/stop times: 500 ms silence -> 1000 ms babble -> target speech -> 1000 ms babble trailer
                const startTime = audioCtx.currentTime + 0.5;
                babbleSource.start(startTime);
                speechSource.start(startTime + 1.0);
                babbleSource.stop(startTime + 1.0 + speechSource.buffer.duration + 1.0);
            });
        },

        // Store data for each trial
        on_finish: function (data) {
            data.sentence = currentSpeechPath;
            data.SNR = currentSNR;
        }
    };

    // Define response question
    var exp_question = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: "Enter the words you heard in the audio:", name: 'response' }
        ],
        on_finish: function (data) {
            const response = data.response.response.trim().toLowerCase();
            const correctAnswer = "yes"; // Placeholder for correct answer logic

            data.correct = (response === correctAnswer);

            // Adjust SNR based on correctness
            if (data.correct) {
                currentSNR = Math.max(currentSNR - stepSize, minSNR);
            } else {
                currentSNR = Math.min(currentSNR + stepSize, maxSNR);
            }
        }
    };

    // Define experiment procedure
    var exp_procedure = {
        timeline: [exp_sound, exp_question],
        repetitions: 3
    };

    exp_block.push(start_trial);
    exp_block.push(preload);
    exp_block.push(exp_procedure);

    // Timeline flow
    timeline = [];
    timeline = timeline.concat(exp_block);

    // Run the experiment
    jsPsych.run(timeline);

</script>

</html>
