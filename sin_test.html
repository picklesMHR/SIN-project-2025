<!DOCTYPE html>
<html>

<head>
    <title>SIN Test Experiment</title>
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugin-preload.js"></script>
    <script src="jspsych/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugin-survey-text.js"></script>
    <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />
</head>

<body></body>

<script>

    /*********************************************************************************/
    /******************************* Global Variables ********************************/
    /*********************************************************************************/

    participant_id = ''; // Participant ID
    maxSNR = 12; // dB
    minSNR = -4; // dB
    currentSNR = maxSNR;
    stepSize = 2; // dB
    var currentSentenceData = null; // Store current sentence object globally
    var sentencePool = []; // Pool of sentences to draw from

    /*********************************************************************************/
    /******************************* Global Functions ********************************/
    /*********************************************************************************/

    // Audio setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function loadAudioBuffer(url) {
        return fetch(url)
            .then(response => response.arrayBuffer())
            .then(arrayBuffer => audioCtx.decodeAudioData(arrayBuffer));
    }

    // shuffleArray function
    function shuffleArray(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Function to prepare randomised sentence pool
    async function prepareSentences() {
        // Load sentence list JSON
        const response = await fetch("configFiles/hint_sentence_lists.json");
        const config = await response.json();

        // Flatten sentences
        const allSentences = Object.entries(config.rawLists).flatMap(([listId, sentences]) =>
            sentences.map(sentence => ({
                id: sentence.id,
                text: sentence.text,
                listId: listId,
                path: `sound/speech/${sentence.id}.wav`
            }))
        );

        // Shuffle sentences to create pool
        sentencePool = shuffleArray(allSentences);
    }

    // Function to get next sentence
    function getNextSentence() {
        if (sentencePool.length === 0) {
            return null;
        }
        return sentencePool.pop();
    }

    /** Scoring functions for HINT responses **/

    // Normalize text by lowercasing, removing punctuation, and trimming whitespace
    function normalise(text) {
        return text
            .toLowerCase()
            .replace(/[^\w\s]/g, "")
            .replace(/\s+/g, " ")
            .trim();
    }

    // Expand "(A/The) boy (is/was) here" → [["a","the"],["boy"],["is","was"],["here"]]
    function expandSentence(rawSentence) {
        const tokens = rawSentence.split(" ");
        const expanded = [];

        tokens.forEach(token => {
            if (token.startsWith("(") && token.endsWith(")")) {
                const opts = token
                    .slice(1, -1)
                    .split("/")
                    .map(w => normalise(w));
                expanded.push(opts);
            } else {
                expanded.push([normalise(token)]);
            }
        });

        return expanded;
    }

    // Score user response against expected sentence
    function scoreHintResponse(rawSentence, userResponse) {
        const expected = expandSentence(rawSentence);
        const responseWords = normalise(userResponse).split(" ");

        let correct = 0;
        let total = expected.length;

        const details = expected.map((options, i) => {
            const match = responseWords.some(w => options.includes(w));
            if (match) correct++;
            return {
                options,
                matched: match
            };
        });

        return {
            correct,
            total,
            proportion: correct / total,
            details
        };
    }

    /*********************************************************************************/
    /***************************** Initialising jsPsych ******************************/
    /*********************************************************************************/

    // Initialise jsPsych
    var jsPsych = initJsPsych({
        show_progress_bar: true,
        on_finish: function () {
            jsPsych.data.displayData();
        }
    });

    // Preload audio files
    var preload = {
        type: jsPsychPreload,
        continue_after_error: true,
        audio: (function () {
            let audioFiles = [];
            // Load all sentence audio files
            sentencePool.forEach(sentence => {
                audioFiles.push(sentence.path);
            });
            // Load all babble SNR levels
            for (let snr = minSNR; snr <= maxSNR; snr += stepSize) {
                audioFiles.push(`sound/babble/SNR${snr}dB.wav`);
            }
            return audioFiles;
        })()
    };

    /*********************************************************************************/
    /***************************** Participant ID Block ******************************/
    /*********************************************************************************/

    var participant_id_block = {
        type: jsPsychSurveyText,
        questions: [{ prompt: "Please enter your participant ID:", name: "participant_id" }],
        on_finish: function (data) {
            jsPsych.data.addProperties({ participant_id: data.response.Q0 });
            participant_id = data.response.Q0;
        }
    };

    /*********************************************************************************/
    /******************************* Sound Check Block *******************************/
    /*********************************************************************************/



    /*********************************************************************************/
    /****************************** Instructions Block *******************************/
    /*********************************************************************************/



    /*********************************************************************************/
    /******************************** Practice Block *********************************/
    /*********************************************************************************/



    /*********************************************************************************/
    /******************************* Experiment Block ********************************/
    /*********************************************************************************/

    // Define experiment block
    var exp_block = [];

    // Simple start trial to begin experiment
    var start_trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Press space to start the audio test.</p>',
        choices: [' '],
        // Ensure audio context is running
        on_finish: function () {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
    };

    // Define audio trial
    var exp_sound = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Listening...</p>',
        choices: "NO_KEYS",
        trial_duration: 5000,

        on_start: function (trial) {
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Get next sentence object and babble track
            const sentenceObj = getNextSentence();
            const babblePath = `sound/babble/SNR${currentSNR}dB.wav`;

            // Store globally for data recording
            currentSentenceData = sentenceObj;

            // Load and play audio buffers
            Promise.all([
                loadAudioBuffer(sentenceObj.path),
                loadAudioBuffer(babblePath)
            ]).then(function (buffers) {
                const speechSource = audioCtx.createBufferSource();
                const babbleSource = audioCtx.createBufferSource();

                speechSource.buffer = buffers[0];
                babbleSource.buffer = buffers[1];

                speechSource.connect(audioCtx.destination);
                babbleSource.connect(audioCtx.destination);

                // Synchronise start/stop times: 500 ms silence -> 1000 ms babble -> target speech -> 1000 ms babble trailer
                const startTime = audioCtx.currentTime + 0.5;
                babbleSource.start(startTime);
                speechSource.start(startTime + 1.0);
                babbleSource.stop(startTime + 1.0 + speechSource.buffer.duration + 1.0);
            });
        },

        // Store data for each trial
        on_finish: function (data) {
            const sentenceData = currentSentenceData || {};
            data.sentence_path = sentenceData.path || '';
            data.sentence_id = sentenceData.id || '';
            data.sentence_text = sentenceData.text || '';
            data.list_id = sentenceData.listId || '';
            data.SNR = currentSNR;
        }
    };

    // Define response question
    var exp_question = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: "Enter the words you heard in the audio:", name: 'response' }
        ],
        on_finish: function (data) {
            // Score response correctness
            const userResponse = data.response.response.trim().toLowerCase();
            const expectedSentence = currentSentenceData.text;

            const score = scoreHintResponse(expectedSentence, userResponse);

            data.user_response = userResponse;
            data.expected_sentence = expectedSentence;
            data.words_correct = score.correct;
            data.words_total = score.total;
            data.proportion_correct = score.proportion;
            data.score_details = score.details;

            // Adjust SNR based on correctness
            if (score.proportion === 1.0) {
                currentSNR = Math.max(currentSNR - stepSize, minSNR);
            } else {
                currentSNR = Math.min(currentSNR + stepSize, maxSNR);
            }
        }
    };

    // Define experiment procedure
    var exp_procedure = {
        timeline: [exp_sound, exp_question],
        repetitions: 13,
        on_timeline_finish: function () {
            // Calculate average SNR over last 5 trials
            const snrData = jsPsych.data.get().filterCustom(d => Number.isFinite(d.SNR));
            const snrValues = snrData.last(5).select('SNR').values;
            const avgSNR = snrValues.length
                ? snrValues.reduce((sum, val) => sum + val, 0) / snrValues.length
                : null;
            jsPsych.data.addDataToLastTrial({ SNR_50: avgSNR });
        }
    };

    exp_block.push(start_trial);
    exp_block.push(preload);
    exp_block.push(exp_procedure);

    /*********************************************************************************/
    /******************************** Build Timeline *********************************/
    /*********************************************************************************/

    // Timeline flow
    timeline = [];
    timeline = timeline.concat(participant_id_block);
    timeline = timeline.concat(exp_block);

    /*********************************************************************************/
    /********************************** Run jsPsych **********************************/
    /*********************************************************************************/

    // Run the experiment
    prepareSentences().then(() => {
        jsPsych.run(timeline);
    });

</script>

</html>
